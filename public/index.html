<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>KRONOS.AG - Cotações</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0B0C10;
            color: white;
            padding: 20px;
        }
        h1 { color: #5C8B4F; margin-bottom: 10px; }
        .btn {
            padding: 10px 20px;
            background: #5C8B4F;
            color: white;
            border: none;
            cursor: pointer;
            margin: 10px 5px;
            border-radius: 5px;
            font-size: 16px;
        }
        .btn:hover { background: #4A7340; }
        .btn:disabled { background: #333; cursor: not-allowed; }
        .commodity {
            background: #1a1a1a;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
        }
        #status {
            font-size: 14px;
            color: #aaa;
            margin: 8px 0;
            min-height: 20px;
        }
        .tag-ok  { color: #2ecc71; }
        .tag-err { color: #e74c3c; }
        canvas {
            margin-top: 25px;
            border-radius: 10px;
            border: 1px solid #222;
            max-width: 100%;
        }
    </style>
</head>

<body>

<h1>KRONOS.AG — Cotações Automáticas</h1>

<button class="btn" id="btnAtualizar" onclick="atualizar()">🔄 Atualizar Cotações</button>
<div id="status">Clique em "Atualizar Cotações" para buscar os dados.</div>

<div id="lista"></div>

<h2 style="margin-top:30px;">📱 Card Instagram</h2>
<button class="btn" onclick="baixarCard('preto')">Baixar Fundo Preto</button>
<button class="btn" onclick="baixarCard('branco')">Baixar Fundo Branco</button>

<br><br>
<canvas id="card" width="1080" height="1920"></canvas>

<script>
// Pré-carrega a logo
const logoImg = new Image();
logoImg.src = 'logo-kronos.png';
let logoCarregada = false;
logoImg.onload = () => { logoCarregada = true; };

// ---- Utilitários ----
function formatPriceBR(value) {
    return value.toFixed(2).replace('.', ',');
}

function dataFormatada() {
    const hoje = new Date();
    const dia = String(hoje.getDate()).padStart(2, '0');
    const mes = String(hoje.getMonth() + 1).padStart(2, '0');
    const ano = hoje.getFullYear();
    return `${dia}/${mes}/${ano}`;
}

// ---- Fetch API ----
async function fetchRealQuotes() {
    const resp = await fetch('/api/cepea-quotes');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    return data;
}

// ---- Atualizar lista ----
async function atualizar() {
    const btn = document.getElementById('btnAtualizar');
    const status = document.getElementById('status');
    btn.disabled = true;
    btn.textContent = '⏳ Buscando...';
    status.innerHTML = 'Buscando cotações...';

    let data;
    let usouFallback = false;

    try {
        data = await fetchRealQuotes();
    } catch (e) {
        console.error('API falhou, usando fallback:', e);
        usouFallback = true;
        data = {
            soja:    { price: 140.93, variation: -0.54, unit: 'saca 60kg',  source: 'CEPEA/Esalq' },
            milho:   { price:  67.67, variation:  0.04, unit: 'saca 60kg',  source: 'CEPEA/Esalq' },
            boi:     { price: 322.45, variation:  0.30, unit: '@',          source: 'CEPEA/Esalq' },
            algodao: { price: 345.60, variation:  0.19, unit: 'cent R$/lb', source: 'CEPEA/Esalq' },
            cafe:    { price:2181.70, variation: -2.26, unit: 'saca 60kg',  source: 'CEPEA/Esalq' },
            dolar:   { price:   5.72, variation:  0.30, unit: 'comercial',  source: 'B3' },
        };
    }

    window.ultimasCotacoes = data;

    const ordem = ['soja', 'milho', 'boi', 'algodao', 'cafe', 'dolar'];
    const labels = { soja:'SOJA', milho:'MILHO', boi:'BOI GORDO', algodao:'ALGODÃO', cafe:'CAFÉ ARÁBICA', dolar:'DÓLAR' };

    let html = '';
    ordem.forEach(key => {
        const c = data[key];
        const varClass = c.variation >= 0 ? 'tag-ok' : 'tag-err';
        const arrow    = c.variation >= 0 ? '▲' : '▼';
        html += `
            <div class="commodity">
                <strong>${labels[key]}</strong> — R$ ${formatPriceBR(c.price)} / ${c.unit}<br>
                Variação: <span class="${varClass}">${arrow} ${Math.abs(c.variation).toFixed(2)}%</span>
                &nbsp;|&nbsp; Fonte: ${c.source}
            </div>`;
    });

    document.getElementById('lista').innerHTML = html;

    if (usouFallback) {
        status.innerHTML = '<span class="tag-err">⚠️ API indisponível — exibindo valores do último registro.</span>';
    } else {
        status.innerHTML = `<span class="tag-ok">✅ Atualizado em ${dataFormatada()} às ${new Date().toLocaleTimeString('pt-BR')}</span>`;
    }

    btn.disabled = false;
    btn.textContent = '🔄 Atualizar Cotações';

    gerarCard(data, ultimaCorFundo);
}

// ---- Geração do Card Canvas ----
function drawMultilineText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
            ctx.fillText(line, x, y);
            line = words[n] + ' ';
            y += lineHeight;
        } else {
            line = testLine;
        }
    }
    ctx.fillText(line, x, y);
}

function gerarCard(data, corFundo = 'preto') {
    const ordem = ['soja', 'milho', 'boi', 'algodao', 'cafe', 'dolar'];
    const labels = { soja:'SOJA', milho:'MILHO', boi:'BOI GORDO', algodao:'ALGODÃO', cafe:'CAFÉ ARÁBICA', dolar:'DÓLAR' };
    const icons  = { soja:'🌱', milho:'🌽', boi:'🐂', algodao:'⚪', cafe:'☕', dolar:'💵' };
    const stripeColors = {
        soja:'#e74c3c', milho:'#27ae60', boi:'#27ae60',
        algodao:'#e67e22', cafe:'#9b59b6', dolar:'#2980b9'
    };

    const canvas = document.getElementById('card');
    const ctx    = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    const cores = corFundo === 'branco' ? {
        fundo: '#FFFFFF', texto: '#2A2A2A', cardBg: '#F5F5F5', rodape: '#2A2A2A'
    } : {
        fundo: '#050607', texto: '#FFFFFF', cardBg: '#131516', rodape: '#FFFFFF'
    };

    // Fundo
    ctx.fillStyle = cores.fundo;
    ctx.fillRect(0, 0, W, H);

    // Logo
    if (logoCarregada) {
        if (corFundo === 'branco') {
            ctx.save();
            ctx.filter = 'brightness(0.3)';
            ctx.drawImage(logoImg, 80, 120, 220, 220);
            ctx.restore();
        } else {
            ctx.drawImage(logoImg, 80, 120, 220, 220);
        }
    }

    // Nome
    ctx.fillStyle = cores.texto;
    ctx.font = 'bold 64px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('KRONOS.AG', 340, 190);

    ctx.font = '28px Arial';
    ctx.fillText('Gestão e curadoria estratégica', 340, 230);
    ctx.fillText('sob medida para o agronegócio', 340, 268);

    // Data (corrigida — usa mês real)
    ctx.textAlign = 'right';
    ctx.font = 'bold 36px Arial';
    ctx.fillText(dataFormatada(), W - 80, 190);
    ctx.textAlign = 'left';

    // Cards
    const startY    = 340;
    const cardH     = 220;
    const cardMargin = 16;
    const cardLeft  = 50;
    const cardRight = W - 50;

    ordem.forEach((key, index) => {
        const c   = data[key];
        const top = startY + index * (cardH + cardMargin);

        ctx.fillStyle = cores.cardBg;
        ctx.fillRect(cardLeft, top, cardRight - cardLeft, cardH);

        ctx.fillStyle = stripeColors[key] || '#5C8B4F';
        ctx.fillRect(cardLeft, top, 12, cardH);

        ctx.fillStyle = cores.texto;
        ctx.textAlign = 'left';
        ctx.font = 'bold 48px Arial';
        ctx.fillText(`${icons[key]}  ${labels[key]}`, cardLeft + 60, top + 70);

        ctx.textAlign = 'right';
        ctx.font = key === 'cafe' ? 'bold 62px Arial' : 'bold 70px Arial';
        ctx.fillText(`R$ ${formatPriceBR(c.price)}`, cardRight - 50, top + 70);

        ctx.textAlign = 'left';
        ctx.font = '26px Arial';
        ctx.fillText(`Fonte: ${c.source}`, cardLeft + 60, top + 115);

        ctx.textAlign = 'right';
        ctx.font = '26px Arial';
        ctx.fillText(`/ ${c.unit}`, cardRight - 50, top + 115);

        const arrow    = c.variation >= 0 ? '▲' : '▼';
        const varColor = c.variation >= 0 ? '#2ecc71' : '#e74c3c';
        ctx.fillStyle = varColor;
        ctx.font = 'bold 34px Arial';
        ctx.fillText(`${arrow} ${Math.abs(c.variation).toFixed(2)}%`, cardRight - 50, top + 180);

        ctx.textAlign = 'left';
    });

    // Rodapé
    ctx.fillStyle = cores.rodape;
    ctx.font = '32px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('kronos-ag.com', W / 2, H - 140);
    ctx.textAlign = 'left';
}

// ---- Download ----
let ultimaCorFundo = 'preto';

function baixarCard(tipo) {
    ultimaCorFundo = tipo;
    const data = window.ultimasCotacoes || {
        soja:    { price: 140.93, variation: -0.54, unit: 'saca 60kg',  source: 'CEPEA/Esalq' },
        milho:   { price:  67.67, variation:  0.04, unit: 'saca 60kg',  source: 'CEPEA/Esalq' },
        boi:     { price: 322.45, variation:  0.30, unit: '@',          source: 'CEPEA/Esalq' },
        algodao: { price: 345.60, variation:  0.19, unit: 'cent R$/lb', source: 'CEPEA/Esalq' },
        cafe:    { price:2181.70, variation: -2.26, unit: 'saca 60kg',  source: 'CEPEA/Esalq' },
        dolar:   { price:   5.72, variation:  0.30, unit: 'comercial',  source: 'B3' },
    };
    gerarCard(data, tipo);
    setTimeout(() => {
        const link = document.createElement('a');
        link.download = `kronos-card-${tipo}.png`;
        link.href = document.getElementById('card').toDataURL('image/png');
        link.click();
    }, 200);
}
</script>

</body>
</html>
