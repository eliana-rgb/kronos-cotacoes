<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRONOS · Boletim do Dia</title>
<!--
  DIRETRIZ KRONOS (sempre seguir):
  Publico 50+. Fontes nunca abaixo de 22px no boletim. Cinzas sempre fortes
  (#4A4A4A ou mais escuro). Contraste alto. Pesos Medium pra labels pequenos.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF9F6;
    --charcoal: #1A1A1A;
    --green-night: #081A13;
    --green: #4C7A3C;
    --gold: #C9A961;
    --mid: #4A4A4A;
    --dark-mid: #3C3C3C;
    --red: #9F2F2F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--cream);
    color: var(--charcoal);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { text-align: center; padding-bottom: 30px; border-bottom: 1px solid rgba(15,15,15,0.1); margin-bottom: 30px; }
  header h1 {
    font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 2.4rem;
    letter-spacing: -0.5px; color: var(--green-night);
  }
  header h1 em { font-style: italic; color: var(--gold); font-weight: 400; }
  header p {
    font-family: 'JetBrains Mono', monospace; font-size: 0.82rem;
    letter-spacing: 2px; text-transform: uppercase; color: var(--mid);
    margin-top: 12px; font-weight: 500;
  }

  /* === Toggle de tema === */
  .theme-toggle {
    display: flex; justify-content: center; gap: 0; margin-bottom: 24px;
    border: 1px solid var(--green-night); width: fit-content; margin-left: auto; margin-right: auto;
  }
  .theme-toggle button {
    font-family: 'Space Grotesk', sans-serif; font-size: 0.9rem; font-weight: 500;
    letter-spacing: 1.5px; text-transform: uppercase; padding: 14px 28px;
    cursor: pointer; border: 0; background: transparent; color: var(--green-night);
    transition: all 0.3s;
  }
  .theme-toggle button.active { background: var(--green-night); color: var(--cream); }
  .theme-toggle button:hover:not(.active) { background: rgba(8,26,19,0.08); }

  .preview-shell {
    background: #fff; border: 1px solid rgba(15,15,15,0.1);
    padding: 16px; margin-bottom: 24px; display: flex; justify-content: center;
  }
  canvas { width: 100%; max-width: 360px; height: auto; display: block; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
  button.action {
    font-family: 'Space Grotesk', sans-serif; font-size: 0.95rem; font-weight: 500;
    letter-spacing: 1.5px; text-transform: uppercase; padding: 18px 32px;
    cursor: pointer; border: 1px solid var(--green-night); background: var(--green-night);
    color: var(--cream); transition: all 0.3s;
  }
  button.action:hover { background: var(--gold); color: var(--green-night); border-color: var(--gold); }
  button.action.secondary { background: transparent; color: var(--charcoal); }
  button.action.secondary:hover { background: var(--green-night); color: var(--cream); }
  button.action:disabled { opacity: 0.4; cursor: wait; }
  .status {
    text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--mid);
    margin-top: 16px; min-height: 18px; font-weight: 500; line-height: 1.5;
  }
  .status.ok { color: var(--green); }
  .status.warn { color: var(--red); }
  .hint {
    text-align: center; color: var(--mid); font-size: 1rem; line-height: 1.7;
    margin-top: 30px; padding-top: 30px; border-top: 1px solid rgba(15,15,15,0.1);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Boletim <em>do dia</em></h1>
    <p>Cotações Kronos · 1080×1920 · Story / Status</p>
  </header>

  <div class="theme-toggle" id="themeToggle">
    <button data-tema="cream" class="active">☀ Cream</button>
    <button data-tema="verde">🌙 Verde-noite</button>
  </div>

  <div class="preview-shell">
    <canvas id="cv" width="1080" height="1920"></canvas>
  </div>

  <div class="controls">
    <button class="action" id="btnDownload">⬇ Baixar imagem</button>
    <button class="action secondary" id="btnRefresh">↻ Atualizar cotações</button>
  </div>

  <div class="status" id="status">Carregando cotações…</div>

  <div class="hint">
    Abra essa página todo dia. Escolha <b>cream</b> ou <b>verde-noite</b>, clique em
    <b>Baixar imagem</b> e a foto vai pra galeria.<br>
    De lá é só postar no Story do Instagram e no Status do WhatsApp.
  </div>
</div>

<script>
const CANVAS = document.getElementById('cv');
const CTX = CANVAS.getContext('2d');
const STATUS = document.getElementById('status');

// === Paletas dos 2 temas ===
const TEMAS = {
  cream: {
    bg: '#FAF9F6',
    textMain: '#1A1A1A',
    textNumber: '#081A13',
    textLabel: '#4A4A4A',
    textLabelStrong: '#3C3C3C',
    accent: '#4C7A3C',
    up: '#4C7A3C',
    down: '#9F2F2F',
    gold: '#C9A961',
    lineStrong: '#1A1A1A',
    lineSoft: 'rgba(15,15,15,0.20)',
  },
  verde: {
    bg: '#081A13',
    textMain: '#FAF9F6',
    textNumber: '#FAF9F6',
    textLabel: '#D4B97A',
    textLabelStrong: '#D4B97A',
    accent: '#A7D269',
    up: '#A7D269',
    down: '#F0957B',
    gold: '#D4B97A',
    lineStrong: '#D4B97A',
    lineSoft: 'rgba(212,185,122,0.30)',
  },
};

const NOMES = { soja:'SOJA', milho:'MILHO', boi:'BOI GORDO', algodao:'ALGODÃO', cafe:'CAFÉ ARÁBICA' };
const MESES = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];

function dataFormatada() {
  const d = new Date();
  const dia = String(d.getDate()).padStart(2,'0');
  return `${dia}.${MESES[d.getMonth()]}.${d.getFullYear()}`;
}
function numeroBoletim() {
  const inicio = new Date(2026, 0, 1);
  return Math.floor((new Date() - inicio) / 86400000) + 1;
}
function fmtBR(v, casas=2) {
  return v.toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas });
}
function fmtVar(v) {
  return `${v>=0?'+':''}${v.toFixed(2).replace('.', ',')}%`;
}

// === Estado ===
let TEMA_ATIVO = 'cream';
let DADOS_ATUAIS = null;

async function buscar() {
  STATUS.textContent = 'Buscando cotações…';
  STATUS.className = 'status';
  try {
    const r = await fetch('/api/cepea-quotes', { cache: 'no-store' });
    if (!r.ok) throw new Error('API falhou');
    const data = await r.json();
    const fonte = r.headers.get('X-Dolar-Source') || (data.dolar && data.dolar.source) || '—';
    const diag = r.headers.get('X-Dolar-Diag') || '';
    if (fonte === 'fallback') {
      STATUS.innerHTML = `Dólar caiu pro fallback · diagnóstico:<br><span style="font-size:0.7rem;opacity:0.8">${diag}</span>`;
      STATUS.className = 'status warn';
    } else {
      STATUS.innerHTML = `Atualizado · dólar via <b>${fonte}</b>` + (diag ? `<br><span style="font-size:0.65rem;opacity:0.6">${diag}</span>` : '');
      STATUS.className = 'status ok';
    }
    return data;
  } catch (e) {
    STATUS.textContent = 'API indisponível · usando valores de exemplo';
    STATUS.className = 'status warn';
    return {
      soja:    { price: 121.30, variation:  0.04, unit: 'saca 60kg' },
      milho:   { price:  67.67, variation:  0.04, unit: 'saca 60kg' },
      boi:     { price: 322.45, variation:  0.30, unit: 'arroba' },
      algodao: { price: 345.60, variation:  0.19, unit: 'cent R$/lb' },
      cafe:    { price:2181.70, variation: -2.26, unit: 'saca 60kg' },
      dolar:   { price:   4.99, variation: 0, unit: 'comercial' },
    };
  }
}

// === Desenho do canvas (mesma estrutura, paleta vem do tema) ===
function desenhar(data, tema) {
  const W = 1080, H = 1920;
  const C = TEMAS[tema];
  const ctx = CTX;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = C.bg;
  ctx.fillRect(0,0,W,H);

  // ===== TOPO =====
  ctx.fillStyle = C.textMain;
  ctx.font = '500 44px "Space Grotesk"';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('KRONOS', 80, 80);

  ctx.fillStyle = C.textLabel;
  ctx.font = '500 20px "JetBrains Mono"';
  ctx.fillText('ENGENHARIA FINANCEIRA PARA O AGRONEGÓCIO', 80, 138);

  ctx.fillStyle = C.textMain;
  ctx.font = '500 30px "JetBrains Mono"';
  ctx.textAlign = 'right';
  ctx.fillText(dataFormatada(), W-80, 80);

  ctx.fillStyle = C.textLabel;
  ctx.font = '400 22px "JetBrains Mono"';
  ctx.fillText(`BOLETIM Nº ${numeroBoletim()}`, W-80, 138);

  ctx.strokeStyle = C.lineStrong;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(80, 200); ctx.lineTo(W-80, 200); ctx.stroke();

  // Eyebrow
  ctx.fillStyle = C.accent;
  ctx.font = '500 30px "JetBrains Mono"';
  ctx.textAlign = 'left';
  ctx.fillText('—  COTAÇÕES DO DIA', 80, 255);

  // ===== DOLAR =====
  ctx.fillStyle = C.textLabelStrong;
  ctx.font = '500 28px "JetBrains Mono"';
  ctx.fillText('DÓLAR COMERCIAL', 80, 325);

  const dolar = data.dolar;
  // R$ pequeno: cor especial no tema verde (gold), normal no cream (green-night)
  ctx.fillStyle = (tema === 'verde') ? C.gold : C.textNumber;
  ctx.textBaseline = 'alphabetic';
  ctx.font = '300 100px "Cormorant Garamond"';
  const baselineY = 560;
  ctx.fillText('R$', 80, baselineY);
  const rsW = ctx.measureText('R$').width;

  ctx.fillStyle = C.textNumber;
  ctx.font = '300 220px "Cormorant Garamond"';
  ctx.fillText(fmtBR(dolar.price), 80 + rsW + 30, baselineY + 10);

  ctx.textBaseline = 'top';
  ctx.fillStyle = dolar.variation >= 0 ? C.up : C.down;
  ctx.font = '500 42px "JetBrains Mono"';
  ctx.fillText(fmtVar(dolar.variation), 80, 615);
  const vW = ctx.measureText(fmtVar(dolar.variation)).width;
  ctx.fillStyle = C.textLabelStrong;
  ctx.font = '500 26px "JetBrains Mono"';
  ctx.fillText('no dia · fonte BCB', 80 + vW + 30, 630);

  ctx.strokeStyle = C.lineStrong;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(80, 735); ctx.lineTo(W-80, 735); ctx.stroke();

  // ===== COMMODITIES =====
  const ordem = ['soja','milho','boi','algodao','cafe'];
  let y = 790;
  const SPACING = 180;
  for (let i = 0; i < ordem.length; i++) {
    const key = ordem[i];
    const c = data[key];
    ctx.fillStyle = C.textMain;
    ctx.font = '500 46px "Space Grotesk"';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(NOMES[key], 80, y);
    ctx.fillStyle = C.textLabel;
    ctx.font = '400 26px "JetBrains Mono"';
    ctx.fillText(c.unit, 80, y + 62);
    ctx.fillStyle = C.textNumber;
    ctx.font = '300 92px "Cormorant Garamond"';
    ctx.textAlign = 'right';
    ctx.fillText(`R$ ${fmtBR(c.price)}`, W-80, y);
    ctx.fillStyle = c.variation >= 0 ? C.up : C.down;
    ctx.font = '500 34px "JetBrains Mono"';
    ctx.fillText(fmtVar(c.variation), W-80, y + 108);

    y += SPACING;
    if (i < ordem.length - 1) {
      ctx.strokeStyle = C.lineSoft;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(80, y - 15); ctx.lineTo(W-80, y - 15); ctx.stroke();
    }
  }

  // ===== RODAPE =====
  ctx.strokeStyle = C.gold;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W/2 - 40, H-160); ctx.lineTo(W/2 + 40, H-160); ctx.stroke();

  ctx.textAlign = 'center';
  ctx.fillStyle = C.textMain;
  ctx.font = '500 30px "JetBrains Mono"';
  ctx.fillText('kronos-ag.com', W/2, H-128);

  ctx.fillStyle = C.textLabelStrong;
  ctx.font = '500 26px "JetBrains Mono"';
  ctx.fillText('@kronosag.br', W/2, H-78);
}

async function gerar(novosDados = true) {
  await document.fonts.ready;
  if (novosDados || !DADOS_ATUAIS) {
    DADOS_ATUAIS = await buscar();
  }
  desenhar(DADOS_ATUAIS, TEMA_ATIVO);
}

function baixar() {
  const link = document.createElement('a');
  const d = new Date();
  const stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  link.download = `kronos-boletim-${TEMA_ATIVO}-${stamp}.png`;
  link.href = CANVAS.toDataURL('image/png');
  link.click();
}

// === Toggle de tema ===
document.getElementById('themeToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const tema = btn.dataset.tema;
  if (tema === TEMA_ATIVO) return;
  TEMA_ATIVO = tema;
  // Visual do toggle
  document.querySelectorAll('#themeToggle button').forEach(b => b.classList.toggle('active', b.dataset.tema === tema));
  // Persiste preferencia
  try { localStorage.setItem('kronos_tema', tema); } catch(e) {}
  // Redesenha sem buscar novamente
  gerar(false);
});

// Recupera preferencia salva
try {
  const t = localStorage.getItem('kronos_tema');
  if (t === 'verde') {
    TEMA_ATIVO = 'verde';
    document.querySelectorAll('#themeToggle button').forEach(b => b.classList.toggle('active', b.dataset.tema === 'verde'));
  }
} catch(e) {}

document.getElementById('btnDownload').addEventListener('click', baixar);
document.getElementById('btnRefresh').addEventListener('click', async () => {
  const b = document.getElementById('btnRefresh');
  b.disabled = true;
  await gerar(true);
  b.disabled = false;
});

gerar(true);
</script>
</body>
</html>
