<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>KRONOS.AG - Cotações</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0B0C10;
            color: white;
            padding: 20px;
        }
        h1 { color: #5C8B4F; margin-bottom: 10px; }
        .btn {
            padding: 10px 20px;
            background: #5C8B4F;
            color: white;
            border: none;
            cursor: pointer;
            margin: 10px 0;
            border-radius: 5px;
            font-size: 16px;
        }
        .commodity {
            background: #1a1a1a;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
        }
        canvas {
            margin-top: 25px;
            border-radius: 10px;
            border: 1px solid #222;
        }
    </style>
</head>

<body>

<h1>KRONOS.AG — Cotações Automáticas</h1>

<button class="btn" onclick="atualizar()">🔄 Atualizar Cotações</button>

<div id="lista"></div>

<h2 style="margin-top:30px;">📱 Card Instagram</h2>
<button class="btn" onclick="baixarCard('preto')">Baixar Fundo Preto</button>

<br><br>
<canvas id="card" width="1080" height="1920"></canvas>

<script>
// Pré-carrega a logo (arquivo precisa se chamar logo-kronos.png
// e estar na mesma pasta do index.html)
const logoImg = new Image();
logoImg.src = 'logo-kronos.png';
let logoCarregada = false;
logoImg.onload = () => { logoCarregada = true; };

// Busca dados da function no Netlify
async function fetchRealQuotes() {
  try {
    const resp = await fetch('/.netlify/functions/cepea-quotes');
    if (!resp.ok) throw new Error('Erro');

    const data = await resp.json();
    return data;

  } catch (e) {
    console.error('Erro ao buscar API; usando fallback.', e);

    return {
      soja:    { price:140.93, variation:-0.54, unit:'saca 60kg',  source:'CEPEA/Esalq' },
      milho:   { price:67.67,  variation:0.04,  unit:'saca 60kg',  source:'CEPEA/Esalq' },
      boi:     { price:322.45, variation:0.30,  unit:'@',          source:'CEPEA/Esalq' },
      algodao: { price:345.60, variation:0.19,  unit:'cent R$/lb', source:'CEPEA/Esalq' },
      cafe:    { price:2181.70,variation:-2.26, unit:'saca 60kg',  source:'CEPEA/Esalq' },
      dolar:   { price:5.72,   variation:0.30,  unit:'comercial',  source:'B3' }
    };
  }
}

async function atualizar() {
    const data = await fetchRealQuotes();

    const ordem = ['soja','milho','boi','algodao','cafe','dolar'];

    let html = "";
    ordem.forEach(key => {
        const c = data[key];
        html += `
            <div class="commodity">
                <strong>${key.toUpperCase()}</strong><br>
                Valor: R$ ${c.price.toFixed(2)}<br>
                Variação: ${c.variation}%<br>
                Unidade: ${c.unit}<br>
                Fonte: ${c.source}
            </div>
        `;
    });

    document.getElementById("lista").innerHTML = html;
    gerarCard(data);
}

// Helper opcional (ainda deixei aqui se a gente quiser usar depois)
function drawMultilineText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        const testWidth = metrics.width;
        if (testWidth > maxWidth && n > 0) {
            ctx.fillText(line, x, y);
            line = words[n] + ' ';
            y += lineHeight;
        } else {
            line = testLine;
        }
    }
    ctx.fillText(line, x, y);
}

function formatPriceBR(value) {
    return value.toFixed(2).replace('.', ',');
}

function gerarCard(data) {
    const ordem = ['soja','milho','boi','algodao','cafe','dolar'];
    const labels = {
        soja: 'SOJA',
        milho: 'MILHO',
        boi: 'BOI GORDO',
        algodao: 'ALGODÃO',
        cafe: 'CAFÉ ARÁBICA',
        dolar: 'DÓLAR'
    };
    const icons = {
        soja: '🌱',
        milho: '🌽',
        boi: '🐂',
        algodao: '⚪',
        cafe: '☕',
        dolar: '💵'
    };
    const stripeColors = {
        soja: '#e74c3c',
        milho: '#27ae60',
        boi: '#27ae60',
        algodao: '#e67e22',
        cafe: '#9b59b6',
        dolar: '#2980b9'
    };

    const canvas = document.getElementById("card");
    const ctx = canvas.getContext("2d");

    const W = canvas.width;
    const H = canvas.height;

    // Fundo geral
    ctx.fillStyle = "#050607";
    ctx.fillRect(0, 0, W, H);

    // HEADER -------------------------------------------------
    // Logo
    if (logoCarregada) {
        const logoWidth = 220;
        const logoHeight = 220;
        const logoX = 80;
        const logoY = 120;
        ctx.drawImage(logoImg, logoX, logoY, logoWidth, logoHeight);
    }

    // Texto à direita da logo
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "bold 64px Arial";
    ctx.fillText("KRONOS.AG", 340, 190);

    // Duas linhas fixas do institucional
    ctx.font = "28px Arial";
    ctx.fillText("Gestão e curadoria estratégica", 340, 240);
    ctx.fillText("sob medida para o agronegócio", 340, 275);

    // Bloco "COTAÇÕES" à direita
    const hoje = new Date();
    const dia = String(hoje.getDate()).padStart(2,'0');
    const mes = String(hoje.getMonth()+1).padStart(2,'0');
    const ano = hoje.getFullYear();
    const dataStr = `${dia}/${mes}/${ano}`;

    ctx.textAlign = "right";
    ctx.font = "bold 42px Arial";
    ctx.fillText("COTAÇÕES", W - 80, 180);
    ctx.font = "26px Arial";
    ctx.fillText(dataStr, W - 80, 220);
    ctx.textAlign = "left";

    // CARDS DE CADA ATIVO ------------------------------------
    let startY = 360;
    const cardHeight = 220;
    const cardMargin = 18;
    const cardLeft = 70;
    const cardRight = W - 70;

    ordem.forEach((key, index) => {
        const c = data[key];
        const top = startY + index * (cardHeight + cardMargin);
        const bottom = top + cardHeight;

        // Fundo do card
        ctx.fillStyle = "#131516";
        ctx.fillRect(cardLeft, top, cardRight - cardLeft, cardHeight);

        // Faixa colorida à esquerda
        ctx.fillStyle = stripeColors[key] || "#5C8B4F";
        ctx.fillRect(cardLeft, top, 10, cardHeight);

        // Ícone + nome + fonte
        ctx.fillStyle = "#FFFFFF";
        ctx.font = "42px Arial";
        const label = labels[key];
        const icon = icons[key] || "";
        ctx.fillText(`${icon}  ${label}`, cardLeft + 40, top + 70);

        ctx.font = "24px Arial";
        ctx.fillText(`Fonte: ${c.source}`, cardLeft + 40, top + 110);

        // Preço + unidade + variação do lado direito
        const priceText = `R$ ${formatPriceBR(c.price)}`;
        const unitText = `/ ${c.unit}`;

        ctx.textAlign = "right";
        ctx.font = "bold 46px Arial";
        ctx.fillText(priceText, cardRight - 40, top + 80);

        ctx.font = "26px Arial";
        ctx.fillText(unitText, cardRight - 40, top + 115);

        // Variação com seta e cor
        const arrow = c.variation >= 0 ? "▲" : "▼";
        const varColor = c.variation >= 0 ? "#2ecc71" : "#e74c3c";
        const varText = `${arrow} ${c.variation.toFixed(2)}%`;

        ctx.fillStyle = varColor;
        ctx.font = "28px Arial";
        ctx.fillText(varText, cardRight - 40, bottom - 30);

        ctx.textAlign = "left";
    });

    // RODAPÉ -------------------------------------------------
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "32px Arial";
    const footer = "kronos-ag.com";
    const footerWidth = ctx.measureText(footer).width;
    ctx.fillText(footer, (W - footerWidth) / 2, H - 60);
}

// Download do card
function baixarCard(tipo) {
    const canvas = document.getElementById("card");
    const link = document.createElement("a");
    link.download = `kronos-card-${tipo}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
}
</script>

</body>
</html>
