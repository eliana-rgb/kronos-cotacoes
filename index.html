<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>KRONOS.AG - Cotações</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0B0F11; /* preto um pouco mais claro */
            color: white;
            padding: 20px;
        }
        h1 {
            color: #5C8B4F;
            margin-bottom: 10px;
        }
        .btn {
            padding: 10px 20px;
            background: #5C8B4F;
            color: white;
            border: none;
            cursor: pointer;
            margin: 10px 0;
            border-radius: 5px;
            font-size: 16px;
        }
        .commodity {
            background: #14181B;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
        }
        canvas {
            margin-top: 25px;
            border-radius: 10px;
            border: 1px solid #222;
            display: block;
        }
    </style>
</head>

<body>

<h1>KRONOS.AG — Cotações Automáticas</h1>

<button class="btn" onclick="atualizar()">🔄 Atualizar Cotações</button>

<div id="lista"></div>

<h2 style="margin-top:30px;">📱 Card Instagram</h2>
<button class="btn" onclick="baixarCard('preto')">Baixar Fundo Preto</button>
<button class="btn" onclick="baixarCard('branco')">Baixar Fundo Branco</button>

<br><br>
<canvas id="card" width="1080" height="1920"></canvas>

<script>
// Pré-carrega a logo (arquivo precisa se chamar logo-kronos.png)
const logoImg = new Image();
logoImg.src = 'logo-kronos.png';
let logoCarregada = false;
logoImg.onload = () => { logoCarregada = true; };

// Busca dados reais
async function fetchRealQuotes() {
  try {
    const resp = await fetch('/.netlify/functions/cepea-quotes');
    if (!resp.ok) throw new Error('Erro');
    const data = await resp.json();
    return data;
  } catch (e) {
    console.error('Erro ao buscar API; usando fallback.', e);
    return {
      soja:    { price:140.93, variation:-0.54, unit:'saca 60kg',  source:'CEPEA/Esalq' },
      milho:   { price:67.67,  variation:0.04,  unit:'saca 60kg',  source:'CEPEA/Esalq' },
      boi:     { price:322.45, variation:0.30,  unit:'@',          source:'CEPEA/Esalq' },
      algodao: { price:345.60, variation:0.19,  unit:'cent R$/lb', source:'CEPEA/Esalq' },
      cafe:    { price:2181.70,variation:-2.26, unit:'saca 60kg',  source:'CEPEA/Esalq' },
      dolar:   { price:5.72,   variation:0.30,  unit:'comercial',  source:'B3' }
    };
  }
}

async function atualizar() {
    const data = await fetchRealQuotes();
    const ordem = ['soja','milho','boi','algodao','cafe','dolar'];
    let html = "";

    ordem.forEach(key => {
        const c = data[key];
        html += `
            <div class="commodity">
                <strong>${key.toUpperCase()}</strong><br>
                Valor: R$ ${c.price.toFixed(2)}<br>
                Variação: ${c.variation}%<br>
                Unidade: ${c.unit}<br>
                Fonte: ${c.source}
            </div>
        `;
    });

    document.getElementById("lista").innerHTML = html;
    gerarCard(data);
}

function formatPriceBR(value) {
    return value.toFixed(2).replace('.', ',');
}

function gerarCard(data) {
    const ordem = ['soja','milho','boi','algodao','cafe','dolar'];
    const labels = {
        soja: 'SOJA',
        milho: 'MILHO',
        boi: 'BOI GORDO',
        algodao: 'ALGODÃO',
        cafe: 'CAFÉ ARÁBICA',
        dolar: 'DÓLAR'
    };
    const icons = {
        soja: '🌱',
        milho: '🌽',
        boi: '🐂',
        algodao: '⚪',
        cafe: '☕',
        dolar: '💵'
    };
    const stripeColors = {
        soja: '#e74c3c',
        milho: '#27ae60',
        boi: '#27ae60',
        algodao: '#e67e22',
        cafe: '#9b59b6',
        dolar: '#2980b9'
    };

    const canvas = document.getElementById("card");
    const ctx = canvas.getContext("2d");

    const W = canvas.width;
    const H = canvas.height;

    // Fundo geral
    ctx.fillStyle = "#0B0F11";
    ctx.fillRect(0, 0, W, H);

    // HEADER -------------------------------------------------

    // Logo
    if (logoCarregada) {
        ctx.drawImage(logoImg, 80, 120, 230, 230);
    }

    // TÍTULO AJUSTADO
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "bold 70px Arial";
    ctx.fillText("KRONOS.AG", 340, 185);

    // Texto institucional
    ctx.font = "34px Arial";
    ctx.fillText("Gestão e curadoria estratégica", 340, 235);
    ctx.fillText("sob medida para o agronegócio", 340, 275);

    // DATA + COTAÇÕES
    const hoje = new Date();
    const dataStr = hoje.toLocaleDateString("pt-BR");

    ctx.textAlign = "right";
    ctx.font = "bold 56px Arial";
    ctx.fillText("COTAÇÕES", W - 80, 185);

    ctx.font = "34px Arial";
    ctx.fillText(dataStr, W - 80, 225);
    ctx.textAlign = "left";

    // CARDS -------------------------------------------------
    let startY = 360;
    const cardHeight = 225;
    const cardMargin = 18;
    const cardLeft = 70;
    const cardRight = W - 70;

    ordem.forEach((key, index) => {
        const c = data[key];
        const top = startY + index * (cardHeight + cardMargin);
        const bottom = top + cardHeight;

        // Fundo card
        ctx.fillStyle = "#1B2024";
        ctx.fillRect(cardLeft, top, cardRight - cardLeft, cardHeight);

        // Faixa colorida
        ctx.fillStyle = stripeColors[key];
        ctx.fillRect(cardLeft, top, 10, cardHeight);

        // Nome + fonte
        ctx.fillStyle = "#FFFFFF";
        ctx.font = "52px Arial";
        ctx.fillText(`${icons[key]}  ${labels[key]}`, cardLeft + 40, top + 80);

        ctx.font = "30px Arial";
        ctx.fillText(`Fonte: ${c.source}`, cardLeft + 40, top + 120);

        // Preço
        ctx.textAlign = "right";
        ctx.font = "bold 60px Arial";
        ctx.fillText(`R$ ${formatPriceBR(c.price)}`, cardRight - 40, top + 85);

        ctx.font = "34px Arial";
        ctx.fillText(`/ ${c.unit}`, cardRight - 40, top + 125);

        // Variação
        const arrow = c.variation >= 0 ? "▲" : "▼";
        const varColor = c.variation >= 0 ? "#2ecc71" : "#e74c3c";

        ctx.fillStyle = varColor;
        ctx.font = "34px Arial";
        ctx.fillText(`${arrow} ${c.variation.toFixed(2)}%`, cardRight - 40, bottom - 35);

        ctx.textAlign = "left";
    });

    // Rodapé
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "34px Arial";
    const footer = "kronos-ag.com";
    const fw = ctx.measureText(footer).width;
    ctx.fillText(footer, (W - fw) / 2, H - 55);
}

// DOWNLOAD DO CARD
function baixarCard(tipo) {
    const originalCanvas = document.getElementById("card");

    // FUNDO BRANCO
    if (tipo === "branco") {
        const temp = document.createElement("canvas");
        temp.width = originalCanvas.width;
        temp.height = originalCanvas.height;

        const ctx2 = temp.getContext("2d");

        ctx2.fillStyle = "#FFFFFF";
        ctx2.fillRect(0, 0, temp.width, temp.height);

        ctx2.drawImage(originalCanvas, 0, 0);

        const link = document.createElement("a");
        link.download = "kronos-card-branco.png";
        link.href = temp.toDataURL("image/png");
        link.click();
        return;
    }

    // FUNDO PRETO
    const link = document.createElement("a");
    link.download = `kronos-card-${tipo}.png`;
    link.href = originalCanvas.toDataURL("image/png");
    link.click();
}
</script>

</body>
</html>
